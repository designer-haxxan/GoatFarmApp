<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pakistan goat &amp; livestock farm management: herd, milk, breeding, health and accounts — offline-first PWA.">
  <meta name="theme-color" content="#2e7d32">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' https://eposwala.com https://cdn.jsdelivr.net; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bakri Farm">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
  <title>Bakri Farm Manager</title>
  <script src="js/autofill.js"></script>
</head>
<body>
  <!-- Splash -->
  <div id="splash">
    <img src="icons/icon-192.png" alt="" width="84" height="84">
    <div class="fw-semibold mt-3">Bakri Farm Manager</div>
    <div class="spinner-border spinner-border-sm text-success mt-3" role="status"><span class="visually-hidden">Loading</span></div>
    <div id="splash-error" class="text-danger small mt-3 px-4 text-center"></div>
  </div>

  <!-- Login -->
  <div id="view-login" class="d-none">
    <!-- Animated sky: sun/moon, clouds, birds -->
    <div class="login-sky" aria-hidden="true">
      <div class="login-sun-orb"></div>
      <div class="login-moon-orb"></div>
      <div class="lc lc1"></div>
      <div class="lc lc2"></div>
      <div class="lc lc3"></div>
      <div class="login-bird lb1"></div>
      <div class="login-bird lb2"></div>
    </div>

    <!-- Enhanced farm landscape pinned to page bottom -->
    <div class="login-landscape" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" preserveAspectRatio="xMidYMax slice" style="width:100%;height:130px;display:block" class="farm-svg">
        <!-- Far hills (light) -->
        <path d="M0 92 Q55 50 130 72 Q200 42 278 66 Q338 42 400 62 L400 130 L0 130Z" fill="#c5e1a5"/>
        <!-- Mid hills -->
        <path d="M0 108 Q70 74 158 94 Q244 70 328 92 Q368 80 400 98 L400 130 L0 130Z" fill="#a5d6a7"/>
        <!-- Foreground grass -->
        <path d="M0 122 Q100 114 200 118 Q300 112 400 120 L400 130 L0 130Z" fill="#81c784"/>
        <!-- Very front strip -->
        <path d="M0 127 Q200 124 400 127 L400 130 L0 130Z" fill="#66bb6a"/>
        <!-- Farmhouse -->
        <rect x="180" y="80" width="44" height="34" rx="2" fill="#ffe0b2"/>
        <polygon points="178,82 226,82 202,64" fill="#c62828"/>
        <rect x="196" y="73" width="12" height="8" rx="1" fill="#ef9a9a" opacity="0.7"/>
        <rect x="186" y="92" width="10" height="14" rx="1" fill="#8d6e63"/>
        <rect x="200" y="90" width="11" height="10" rx="1" fill="#b3e5fc" opacity="0.9"/>
        <rect x="214" y="90" width="9" height="10" rx="1" fill="#b3e5fc" opacity="0.9"/>
        <!-- Smoke from chimney -->
        <circle cx="220" cy="60" r="4" fill="rgba(200,200,200,0.4)"/>
        <circle cx="223" cy="53" r="3.5" fill="rgba(200,200,200,0.3)"/>
        <circle cx="221" cy="47" r="3" fill="rgba(200,200,200,0.2)"/>
        <!-- Left pine cluster -->
        <rect x="40" y="70" width="5" height="40" rx="2" fill="#4e342e"/>
        <polygon points="42.5,64 27,90 58,90" fill="#1b5e20"/>
        <polygon points="42.5,52 26,80 59,80" fill="#2e7d32"/>
        <polygon points="42.5,40 28,66 57,66" fill="#388e3c"/>
        <rect x="62" y="75" width="4" height="32" rx="2" fill="#4e342e"/>
        <polygon points="64,70 52,92 76,92" fill="#2e7d32"/>
        <polygon points="64,58 51,82 77,82" fill="#388e3c"/>
        <!-- Right pine cluster -->
        <rect x="323" y="70" width="5" height="40" rx="2" fill="#4e342e"/>
        <polygon points="325.5,64 310,90 341,90" fill="#1b5e20"/>
        <polygon points="325.5,52 309,80 342,80" fill="#2e7d32"/>
        <polygon points="325.5,40 311,66 340,66" fill="#388e3c"/>
        <rect x="344" y="75" width="4" height="32" rx="2" fill="#4e342e"/>
        <polygon points="346,70 334,92 358,92" fill="#2e7d32"/>
        <polygon points="346,58 333,82 359,82" fill="#388e3c"/>
        <!-- Tiny goat on far hill -->
        <ellipse cx="292" cy="76" rx="9" ry="5" fill="#c9a870" opacity="0.55"/>
        <ellipse cx="300" cy="73" rx="4.5" ry="3.8" fill="#c9a870" opacity="0.55"/>
        <line x1="287" y1="81" x2="286" y2="87" stroke="#a07040" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
        <line x1="291" y1="81" x2="290" y2="87" stroke="#a07040" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
        <line x1="295" y1="81" x2="294" y2="87" stroke="#a07040" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
        <line x1="299" y1="80" x2="298" y2="87" stroke="#a07040" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
        <!-- Fence rails -->
        <line x1="0" y1="116" x2="400" y2="116" stroke="#8d6e63" stroke-width="2.5"/>
        <line x1="0" y1="124" x2="400" y2="124" stroke="#8d6e63" stroke-width="2.5"/>
        <!-- Fence posts -->
        <line x1="12"  y1="109" x2="12"  y2="130" stroke="#6d4c41" stroke-width="4"/>
        <line x1="42"  y1="109" x2="42"  y2="130" stroke="#6d4c41" stroke-width="4"/>
        <line x1="72"  y1="109" x2="72"  y2="130" stroke="#6d4c41" stroke-width="4"/>
        <line x1="102" y1="109" x2="102" y2="130" stroke="#6d4c41" stroke-width="4"/>
        <line x1="132" y1="109" x2="132" y2="130" stroke="#6d4c41" stroke-width="4"/>
        <line x1="162" y1="109" x2="162" y2="130" stroke="#6d4c41" stroke-width="4"/>
        <line x1="240" y1="109" x2="240" y2="130" stroke="#6d4c41" stroke-width="4"/>
        <line x1="270" y1="109" x2="270" y2="130" stroke="#6d4c41" stroke-width="4"/>
        <line x1="300" y1="109" x2="300" y2="130" stroke="#6d4c41" stroke-width="4"/>
        <line x1="330" y1="109" x2="330" y2="130" stroke="#6d4c41" stroke-width="4"/>
        <line x1="360" y1="109" x2="360" y2="130" stroke="#6d4c41" stroke-width="4"/>
        <line x1="390" y1="109" x2="390" y2="130" stroke="#6d4c41" stroke-width="4"/>
        <!-- Water well -->
        <circle cx="36" cy="105" r="10" fill="none" stroke="#8d6e63" stroke-width="2.5"/>
        <path class="farm-water" d="M26,105 Q36,102 46,105 L46,107 Q36,110 26,107Z" fill="#64b5f6" opacity="0.8"/>
        <rect x="24" y="100" width="24" height="4" rx="1" fill="#a1887f" opacity="0.6"/>
        <line x1="34" y1="100" x2="34" y2="89" stroke="#8d6e63" stroke-width="1.5"/>
        <line x1="38" y1="100" x2="38" y2="89" stroke="#8d6e63" stroke-width="1.5"/>

        <!-- Grazing goat silhouettes on mid-hill -->
        <g class="farm-grazer" opacity="0.7">
          <ellipse cx="110" cy="92" rx="8" ry="4.5" fill="#8d6e63"/>
          <ellipse cx="116" cy="90" rx="4" ry="3.2" fill="#8d6e63"/>
          <line x1="106" y1="96" x2="105" y2="102" stroke="#5c3c1c" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="110" y1="96" x2="110" y2="102" stroke="#5c3c1c" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="114" y1="96" x2="114" y2="102" stroke="#5c3c1c" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="118" y1="95" x2="118" y2="102" stroke="#5c3c1c" stroke-width="1.5" stroke-linecap="round"/>
        </g>

        <!-- Another grazing goat -->
        <g class="farm-grazer-2" opacity="0.65">
          <ellipse cx="350" cy="95" rx="7.5" ry="4" fill="#9a8176"/>
          <ellipse cx="355" cy="93" rx="3.8" ry="3" fill="#9a8176"/>
          <line x1="346" y1="99" x2="345" y2="104" stroke="#5c3c1c" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="350" y1="99" x2="350" y2="104" stroke="#5c3c1c" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="354" y1="99" x2="354" y2="104" stroke="#5c3c1c" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="358" y1="98" x2="358" y2="104" stroke="#5c3c1c" stroke-width="1.4" stroke-linecap="round"/>
        </g>

        <!-- Wildflowers with swaying effect -->
        <g class="farm-leaf" style="transform-origin: 88px 130px">
          <circle cx="88"  cy="123" r="3.5" fill="#f06292"/><circle cx="88"  cy="123" r="1.8" fill="#fff"/>
          <line x1="88"  y1="125" x2="88"  y2="130" stroke="#388e3c" stroke-width="1.5"/>
        </g>
        <g class="farm-leaf" style="transform-origin: 150px 130px; animation-delay: .5s">
          <circle cx="150" cy="124" r="3"   fill="#ffb74d"/><circle cx="150" cy="124" r="1.5" fill="#fff"/>
          <line x1="150" y1="126" x2="150" y2="130" stroke="#388e3c" stroke-width="1.5"/>
        </g>
        <g class="farm-leaf" style="transform-origin: 252px 130px; animation-delay: 1s">
          <circle cx="252" cy="123" r="3.5" fill="#e91e63"/><circle cx="252" cy="123" r="1.8" fill="#fff"/>
          <line x1="252" y1="125" x2="252" y2="130" stroke="#388e3c" stroke-width="1.5"/>
        </g>
        <g class="farm-leaf" style="transform-origin: 314px 130px; animation-delay: 1.5s">
          <circle cx="314" cy="123" r="3"   fill="#ff9800"/><circle cx="314" cy="123" r="1.5" fill="#fff"/>
          <line x1="314" y1="125" x2="314" y2="130" stroke="#388e3c" stroke-width="1.5"/>
        </g>
        <!-- Grass tufts -->
        <path d="M22,130 L24,122 L26,130 L28,121 L30,130" stroke="#4caf50" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M200,130 L202,122 L204,130 L206,121 L208,130" stroke="#4caf50" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M376,130 L378,122 L380,130 L382,121 L384,130" stroke="#4caf50" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="login-wrap">
      <!-- Goat mascot illustration -->
      <div class="login-mascot" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" class="login-goat-svg">
          <!-- Ground shadow -->
          <ellipse cx="97" cy="133" rx="74" ry="7" fill="rgba(0,100,20,0.1)"/>
          <!-- Body -->
          <ellipse cx="82" cy="83" rx="55" ry="30" fill="#c9a870"/>
          <!-- Belly highlight -->
          <ellipse cx="82" cy="94" rx="36" ry="16" fill="#dfc090" opacity="0.5"/>
          <!-- Neck fill -->
          <path d="M 112,68 L 132,64 L 138,46 L 118,50 Z" fill="#c9a870"/>
          <!-- Head -->
          <ellipse cx="140" cy="52" rx="22" ry="19" fill="#c9a870"/>
          <!-- Ear outer -->
          <ellipse cx="126" cy="43" rx="11" ry="6" fill="#b08550" transform="rotate(-28 126 43)"/>
          <!-- Ear inner -->
          <ellipse cx="126" cy="43" rx="7.5" ry="3.5" fill="#c9907a" transform="rotate(-28 126 43)"/>
          <!-- Horn back -->
          <path d="M 130,34 Q 120,16 131,23" stroke="#5c3c1c" stroke-width="5" fill="none" stroke-linecap="round"/>
          <!-- Horn front -->
          <path d="M 142,32 Q 134,14 147,22" stroke="#5c3c1c" stroke-width="5" fill="none" stroke-linecap="round"/>
          <!-- Snout -->
          <ellipse cx="158" cy="58" rx="12" ry="9" fill="#b08550"/>
          <!-- Nostrils -->
          <circle cx="154" cy="57" r="2.4" fill="#5c3c1c"/>
          <circle cx="161" cy="57" r="2.4" fill="#5c3c1c"/>
          <!-- Smile -->
          <path d="M 152,64 Q 158,68 164,64" stroke="#7a4c2a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <!-- Eye -->
          <circle cx="148" cy="47" r="5" fill="#1a0c00"/>
          <!-- Eye shine -->
          <circle cx="150" cy="45" r="2.2" fill="white" opacity="0.7"/>
          <!-- Beard -->
          <path d="M 158,67 Q 163,80 157,87 Q 154,93 150,86 Q 147,93 143,85 Q 140,91 137,84 Q 134,79 138,68 Q 143,71 148,69 Q 153,68 158,67 Z" fill="#ecddb8"/>
          <!-- Back legs -->
          <rect x="40" y="108" width="14" height="24" rx="5" fill="#a07040"/>
          <rect x="62" y="108" width="14" height="24" rx="5" fill="#a07040"/>
          <!-- Back hooves -->
          <rect x="40" y="126" width="14" height="6" rx="3" fill="#5c3c1e"/>
          <rect x="62" y="126" width="14" height="6" rx="3" fill="#5c3c1e"/>
          <!-- Front legs -->
          <rect x="104" y="108" width="14" height="24" rx="5" fill="#a07040"/>
          <rect x="126" y="108" width="14" height="24" rx="5" fill="#a07040"/>
          <!-- Front hooves -->
          <rect x="104" y="126" width="14" height="6" rx="3" fill="#5c3c1e"/>
          <rect x="126" y="126" width="14" height="6" rx="3" fill="#5c3c1e"/>
          <!-- Tail -->
          <path d="M 27,76 Q 14,63 20,80" stroke="#c9a870" stroke-width="8" fill="none" stroke-linecap="round"/>
          <!-- Udder -->
          <ellipse cx="80" cy="110" rx="12" ry="6" fill="#e0b898" opacity="0.7"/>
          <!-- Grass tufts -->
          <path d="M 22,132 L 25,122 L 28,132 L 31,121 L 34,132" stroke="#4caf50" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M 158,132 L 161,122 L 164,132 L 167,121 L 170,132" stroke="#4caf50" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="card shadow-sm login-card">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <img src="icons/icon-192.png" alt="" width="64" height="64" class="mb-2">
            <h1 class="h4 mb-1" id="login-title">Bakri Farm Manager</h1>
            <div class="text-body-secondary small">Sign in to continue</div>
          </div>
          <div id="login-notice" class="alert alert-warning small d-none"></div>
          <form id="login-form" novalidate>
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="login-username" name="username" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
              <label for="login-username" id="login-username-label">Username</label>
            </div>
            <div class="form-floating mb-3 position-relative">
              <input type="password" class="form-control" id="login-password" name="password" placeholder="Password" autocomplete="current-password" required>
              <label for="login-password" id="login-password-label">Password</label>
              <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y text-body-secondary" id="toggle-pw" aria-label="Show password"><i class="bi bi-eye"></i></button>
            </div>
            <div id="login-error" class="alert alert-danger py-2 small d-none"></div>
            <button type="submit" class="btn btn-success btn-lg w-100" id="login-btn">Sign in</button>
          </form>
          <div class="text-center mt-3">
            <button class="btn btn-outline-secondary btn-sm" id="lang-toggle">اردو</button>
          </div>
          <div class="text-center small text-body-secondary mt-2" id="login-conn"></div>
        </div>
      </div>
      <div class="text-center small text-body-secondary mt-3" id="login-internet-note">Internet is required to sign in. After sign-in the app works offline.</div>
    </div>
  </div>

  <!-- Application -->
  <div id="view-app" class="d-none">
    <aside id="sidebar" class="d-none d-lg-flex flex-column">
      <div class="sidebar-brand">
        <img src="icons/icon-192.png" alt="" width="28" height="28">
        <span id="brand-name">Bakri Farm</span>
      </div>
      <nav class="nav flex-column flex-grow-1 overflow-auto nav-menu" aria-label="Main"></nav>
    </aside>
    <div class="app-main">
      <header class="app-topbar">
        <button class="btn btn-link text-body d-lg-none px-1" data-bs-toggle="offcanvas" data-bs-target="#menu-offcanvas" aria-label="Menu"><i class="bi bi-list fs-4"></i></button>
        <div class="fw-semibold text-truncate flex-grow-1" id="topbar-title">Dashboard</div>
        <span id="conn-badge" class="badge rounded-pill conn-online" title="Connection status"><i class="bi bi-wifi"></i> <span>Online</span></span>
        <button class="btn btn-link text-body px-1 btn-sm" id="lang-toggle" title="Toggle language"><i class="bi bi-translate"></i></button>
        <div class="dropdown">
          <button class="btn btn-link text-body px-1" data-bs-toggle="dropdown" aria-label="Account"><i class="bi bi-person-circle fs-5"></i></button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><div class="dropdown-item-text small"><div class="fw-semibold" id="user-name"></div><div class="text-body-secondary" id="user-role"></div></div></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#/settings"><i class="bi bi-gear me-2"></i>Settings</a></li>
            <li><button class="dropdown-item d-none" id="install-btn"><i class="bi bi-download me-2"></i>Install app</button></li>
            <li><button class="dropdown-item text-danger" id="logout-btn"><i class="bi bi-box-arrow-right me-2"></i>Log out</button></li>
          </ul>
        </div>
      </header>
      <main id="content" tabindex="-1"></main>
    </div>
    <nav id="bottom-nav" class="d-lg-none" aria-label="Quick navigation">
      <a href="#/dashboard" data-route="dashboard"><i class="bi bi-house"></i><span>Home</span></a>
      <a href="#/animals" data-route="animals"><i class="bi bi-collection"></i><span>Animals</span></a>
      <a href="#/milk" data-route="milk" class="nav-milk"><i class="bi bi-droplet-half-fill"></i><span>Milk</span></a>
      <a href="#/buyers" data-route="buyers"><i class="bi bi-people"></i><span>Buyers</span></a>
      <a href="#" data-bs-toggle="offcanvas" data-bs-target="#menu-offcanvas"><i class="bi bi-grid"></i><span>More</span></a>
    </nav>
  </div>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="menu-offcanvas" aria-labelledby="menu-title">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="menu-title">Menu</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body p-0"><nav class="nav flex-column nav-menu" aria-label="Main"></nav></div>
  </div>

  <div id="toast-container" class="toast-container position-fixed top-0 start-50 translate-middle-x p-3"></div>
  <div id="loading-overlay" class="d-none"><div class="bg-body rounded-3 shadow p-3 d-flex align-items-center gap-2"><div class="spinner-border spinner-border-sm text-success"></div><span class="loading-text">Please wait…</span></div></div>
  <div id="print-area" aria-hidden="true"></div>

  <noscript><div class="alert alert-danger m-3">JavaScript is required to run this application.</div></noscript>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
